<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="planeGrad1" x1="20%" y1="90%" x2="85%" y2="25%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="planeGrad2" x1="20%" y1="90%" x2="70%" y2="50%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Glowing trail / energy beam -->
  <path d="M 28 98 L 88 44 L 46 84 Z" fill="url(#planeGrad2)" opacity="0.6" filter="url(#glow)"/>

  <!-- Left Wing -->
  <path d="M 26 68 L 88 40 L 46 96 Z" fill="url(#planeGrad2)" opacity="0.9"/>
  <!-- Right Wing -->
  <path d="M 88 40 L 46 96 L 68 84 Z" fill="url(#planeGrad1)"/>
  <!-- Top/Main Body -->
  <path d="M 26 68 L 88 40 L 68 84 Z" fill="url(#planeGrad1)" filter="url(#glow)"/>

  <!-- Glass overlay highlight -->
  <path d="M 26 68 L 88 40 L 52 74 Z" fill="#FFFFFF" opacity="0.25"/>

  <!-- AI Star Sparkle at the tip -->
  <g transform="translate(88, 40)" filter="url(#glow)">
    <!-- Outer 8-point star glow -->
    <path d="M 0 -16 L 3.5 -4.5 L 16 0 L 3.5 4.5 L 0 16 L -3.5 4.5 L -16 0 L -3.5 -4.5 Z" fill="url(#starGrad)"/>
    <!-- Center white core -->
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Ambient star sparkles -->
  <circle cx="96" cy="22" r="1.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="108" cy="46" r="2" fill="#C084FC" opacity="0.7"/>
  <circle cx="76" cy="24" r="1.5" fill="#818CF8" opacity="0.8"/>
  <circle cx="34" cy="42" r="1.5" fill="#38BDF8" opacity="0.6"/>
</svg>
