<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Standard Labels Fixture</title>
  </head>
  <body>
    <h1>Application form — standard labels</h1>
    <form>
      <p>
        <label for="full-name">Full Name</label>
        <input id="full-name" name="full-name" type="text" />
      </p>
      <p>
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" />
      </p>
      <p>
        <label for="cover-letter">Cover Letter</label>
        <textarea id="cover-letter" name="cover-letter"></textarea>
      </p>
      <p>
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select…</option>
          <option value="us">United States</option>
          <option value="lk">Sri Lanka</option>
        </select>
      </p>

      <!-- A non-form element that must NOT be detected as a field. -->
      <div>Just some descriptive paragraph text, not an input.</div>
    </form>
  </body>
</html>
